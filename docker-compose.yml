services:

  disaster-dashboard:
    image: disaster-recovery-dashboard:latest
    container_name: disaster-dashboard
    ports:
      - "8081:80"
    restart: always

  employee-api:
    image: employee-api:latest
    container_name: employee-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://employee-postgres:5432/employee
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - employee-postgres
    restart: always

  employee-postgres:
    image: postgres:16
    container_name: employee-postgres
    environment:
      POSTGRES_DB: employee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres-data:
