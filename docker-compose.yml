services:

  disaster-dashboard:
    image: disaster-recovery-dashboard:latest
    container_name: disaster-dashboard
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always


  employee-api:
    image: employee-api:latest
    container_name: employee-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://employee-postgres:5432/employee
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      employee-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/employees || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always


  employee-postgres:
    image: postgres:16
    container_name: employee-postgres
    environment:
      POSTGRES_DB: employee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always


volumes:
  postgres-data:
